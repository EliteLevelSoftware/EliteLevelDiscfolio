name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'windows-latest' && github.repository == 'EliteLevelSoftware/EliteLevelDiscfolio-archive' && vars.WINDOWS_RUNNER != 'github' && fromJSON('["self-hosted","Windows","elitelevel-pc"]') || matrix.os == 'ubuntu-latest' && github.repository == 'EliteLevelSoftware/EliteLevelDiscfolio-archive' && vars.LINUX_RUNNER == 'elitelevel-linux' && fromJSON('["self-hosted","Linux","elitelevel-linux"]') || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test EliteLevelDiscfolio.slnx -c Release --nologo
      - name: Clean workspace
        if: always() && runner.environment == 'self-hosted'
        continue-on-error: true
        shell: bash
        run: git -c core.longpaths=true clean -ffdxq

  macos:
    name: Build and test (macos-latest)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test EliteLevelDiscfolio.slnx -c Release --nologo

  velopack:
    name: Velopack pack (no upload)
    runs-on: ${{ github.repository == 'EliteLevelSoftware/EliteLevelDiscfolio-archive' && vars.WINDOWS_RUNNER != 'github' && fromJSON('["self-hosted","Windows","elitelevel-pc"]') || 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish
        run: dotnet publish src/EliteLevel.Disc.App/EliteLevel.Disc.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/pack
      - name: Install vpk
        shell: pwsh
        run: |
          dotnet tool install vpk --version 1.2.161 --tool-path "$env:RUNNER_TEMP\vpk"
          if ($LASTEXITCODE -ne 0) { throw "vpk install failed" }
          "$env:RUNNER_TEMP\vpk" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Pack
        shell: pwsh
        run: |
          $version = (([xml](Get-Content -Raw Directory.Build.props)).Project.PropertyGroup.Version | Select-Object -First 1).Trim()
          New-Item -ItemType Directory -Force artifacts/velopack | Out-Null
          vpk --yes pack --packId Discfolio --packVersion $version --packDir artifacts/pack --mainExe Discfolio.exe --packTitle "EliteLevel Discfolio" --packAuthors "Elite Level Software" --icon src/EliteLevel.Disc.App/Assets/icon.ico --channel win-x64-stable --shortcuts Desktop,StartMenuRoot --delta none --noPortable --outputDir artifacts/velopack
          if ($LASTEXITCODE -ne 0) { throw "vpk pack failed" }
          bash scripts/rename-release-assets.sh artifacts/velopack $version windows win-x64-stable
          if ($LASTEXITCODE -ne 0) { throw "rename failed" }
          Get-ChildItem artifacts/velopack | Select-Object -ExpandProperty Name
      - uses: actions/upload-artifact@v4
        with:
          name: velopack-dry-run
          path: artifacts/velopack
      - name: Clean workspace
        if: always() && runner.environment == 'self-hosted'
        continue-on-error: true
        shell: bash
        run: git -c core.longpaths=true clean -ffdxq

  velopack-linux:
    name: Velopack pack Linux (no upload)
    runs-on: ${{ github.repository == 'EliteLevelSoftware/EliteLevelDiscfolio-archive' && vars.LINUX_RUNNER == 'elitelevel-linux' && fromJSON('["self-hosted","Linux","elitelevel-linux"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish and pack
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y squashfs-tools
          dotnet publish src/EliteLevel.Disc.App/EliteLevel.Disc.App.csproj -c Release -r linux-x64 --self-contained true -o artifacts/pack
          dotnet tool install --global vpk --version 1.2.161
          export PATH="$PATH:$HOME/.dotnet/tools"
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1 | tr -d '[:space:]')
          mkdir -p artifacts/velopack
          # Same flags as the tag workflow. vpk 1.2.161 has no --noPortable on Linux.
          vpk --yes pack --packId Discfolio --packVersion "$version" --packDir artifacts/pack --mainExe Discfolio --packTitle "EliteLevel Discfolio" --packAuthors "Elite Level Software" --icon src/EliteLevel.Disc.App/Assets/icon.png --channel linux-x64-stable --delta none --outputDir artifacts/velopack
          bash scripts/rename-release-assets.sh artifacts/velopack "$version" linux linux-x64-stable
          test -f "artifacts/velopack/Discfolio-${version}-Linux-x64.AppImage"
          test -f "artifacts/velopack/Discfolio-${version}-linux-x64-stable-full.nupkg"
          test -f "artifacts/velopack/releases.linux-x64-stable.json"
          ls -la artifacts/velopack
      - uses: actions/upload-artifact@v4
        with:
          name: velopack-linux-dry-run
          path: artifacts/velopack

  velopack-macos:
    name: Velopack pack macOS (no upload)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish and pack
        run: |
          set -euo pipefail
          dotnet publish src/EliteLevel.Disc.App/EliteLevel.Disc.App.csproj -c Release -r osx-arm64 --self-contained true -o artifacts/pack
          dotnet tool install --global vpk --version 1.2.161
          export PATH="$PATH:$HOME/.dotnet/tools"
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1 | tr -d '[:space:]')
          mkdir -p artifacts/velopack
          vpk --yes pack \
            --packId Discfolio \
            --packVersion "$version" \
            --packDir artifacts/pack \
            --mainExe Discfolio \
            --packTitle "EliteLevel Discfolio" \
            --packAuthors "Elite Level Software" \
            --icon src/EliteLevel.Disc.App/Assets/icon.icns \
            --channel osx-arm64-stable \
            --delta none \
            --noPortable \
            --outputDir artifacts/velopack
          bash scripts/rename-release-assets.sh artifacts/velopack "$version" macos osx-arm64-stable
          test -f "artifacts/velopack/Discfolio-${version}-macOS-AppleSilicon-Setup.pkg"
          test -f "artifacts/velopack/Discfolio-${version}-osx-arm64-stable-full.nupkg"
          test -f "artifacts/velopack/releases.osx-arm64-stable.json"
          ls -la artifacts/velopack
      - uses: actions/upload-artifact@v4
        with:
          name: velopack-macos-dry-run
          path: artifacts/velopack
