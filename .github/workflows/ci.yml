name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test EliteLevelDiscfolio.slnx -c Release --nologo

  windows-portable:
    name: Windows portable and MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish portable GUI
        run: dotnet publish src/EliteLevel.Disc.App/EliteLevel.Disc.App.csproj -c Release /p:PublishProfile=win-x64-portable
      - name: Publish CLI
        run: dotnet publish src/EliteLevel.Disc.Cli/EliteLevel.Disc.Cli.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/win-x64
      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build MSI
        run: wix build installer/wix/Discfolio.wxs -d PublishDir=artifacts/win-x64 -o artifacts/EliteLevelDiscfolio-0.1.0.msi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: |
            artifacts/win-x64/Discfolio.exe
            artifacts/win-x64/discfolio.exe
            artifacts/EliteLevelDiscfolio-0.1.0.msi
