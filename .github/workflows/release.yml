name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test EliteLevelDiscfolio.slnx -c Release --nologo

  windows:
    name: Windows release
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Version
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          props=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1 | tr -d '[:space:]')
          case "$tag" in
            "$props"|"$props"-*) ;;
            *) echo "Tag v$tag does not match Directory.Build.props version $props" >&2; exit 1 ;;
          esac
          if [[ "$tag" == *-* ]]; then
            echo "track=prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "track=stable" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - name: Release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          track="${{ steps.version.outputs.track }}"
          awk -v ver="$version" '
            $0 == "## " ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no notes for $version" >&2
            exit 1
          fi
          cat > release-body.md <<'EOF'
          ## Download

          | File | What it is |
          |---|---|
          | `Discfolio-VERSION-Windows-Setup.exe` | Windows installer. Installs per user to `%LocalAppData%\Discfolio`, adds Start Menu and Desktop shortcuts, and does not need administrator rights. |
          | `Discfolio-VERSION-macOS-AppleSilicon-Setup.pkg` | macOS installer for Apple silicon. Unsigned, so Gatekeeper asks before the app opens. |
          | `Discfolio-VERSION-Linux-x64.AppImage` | Linux AppImage for x64. Mark it executable and run it. Attached when the Linux pack succeeds. |

          `SHA256SUMS.txt` is the SHA-256 digest of the files on this release.

          ## Auto-updater files (you don't need these)

          Discfolio's built-in updater downloads these files. Leave them on the release.

          | File | What it is |
          |---|---|
          | `Discfolio-VERSION-win-x64-TRACK-full.nupkg` | Windows update package. |
          | `Discfolio-VERSION-linux-x64-TRACK-full.nupkg` | Linux update package. |
          | `Discfolio-VERSION-osx-arm64-TRACK-full.nupkg` | macOS update package. |
          | `releases.win-x64-TRACK.json` | Windows update index. |
          | `releases.linux-x64-TRACK.json` | Linux update index. |
          | `releases.osx-arm64-TRACK.json` | macOS update index. |

          ## VERSION
          EOF
          sed "s/VERSION/${version}/g; s/TRACK/${track}/g" release-body.md > release-body.out
          mv release-body.out release-body.md
          cat release-notes.md >> release-body.md
      - name: Publish
        run: dotnet publish src/EliteLevel.Disc.App/EliteLevel.Disc.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/pack
      - name: Install vpk
        shell: pwsh
        run: |
          dotnet tool install --global vpk --version 1.2.161
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Pack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false
          $channel = "win-x64-${{ steps.version.outputs.track }}"
          $out = "artifacts/velopack"
          New-Item -ItemType Directory -Force $out | Out-Null
          & vpk --yes pack --packId Discfolio --packVersion "${{ steps.version.outputs.version }}" --packDir artifacts/pack --mainExe Discfolio.exe --packTitle "EliteLevel Discfolio" --packAuthors "Elite Level Software" --icon src/EliteLevel.Disc.App/Assets/icon.ico --channel $channel --shortcuts Desktop,StartMenuRoot --delta none --noPortable --releaseNotes release-notes.md --outputDir $out
          if ($LASTEXITCODE -ne 0) { throw "vpk pack failed" }
          bash scripts/rename-release-assets.sh $out "${{ steps.version.outputs.version }}" windows $channel
          if ($LASTEXITCODE -ne 0) { throw "rename failed" }
          Get-ChildItem $out | Select-Object -ExpandProperty Name
      - name: Upload
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $channel = "win-x64-${{ steps.version.outputs.track }}"
          $upload = @("upload","github","--outputDir","artifacts/velopack","--channel",$channel,"--repoUrl","https://github.com/EliteLevelSoftware/EliteLevelDiscfolio","--token",$env:GITHUB_TOKEN,"--publish","--releaseName","EliteLevel Discfolio ${{ steps.version.outputs.version }}","--tag","${{ github.ref_name }}")
          if ("${{ steps.version.outputs.track }}" -eq "prerelease") { $upload += "--pre" }
          & vpk @upload
          if ($LASTEXITCODE -ne 0) { throw "vpk upload failed" }
      - name: Describe the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo EliteLevelSoftware/EliteLevelDiscfolio --notes-file release-body.md

  linux:
    name: Linux pack
    needs: windows
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 == "## " ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
      - name: Publish and pack
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y squashfs-tools
          dotnet publish src/EliteLevel.Disc.App/EliteLevel.Disc.App.csproj -c Release -r linux-x64 --self-contained true -o artifacts/pack
          dotnet tool install --global vpk --version 1.2.161
          export PATH="$PATH:$HOME/.dotnet/tools"
          tag="${GITHUB_REF_NAME#v}"
          if [[ "$tag" == *-* ]]; then track=prerelease; else track=stable; fi
          channel="linux-x64-$track"
          mkdir -p artifacts/velopack
          vpk --yes pack --packId Discfolio --packVersion "$tag" --packDir artifacts/pack --mainExe Discfolio --packTitle "EliteLevel Discfolio" --packAuthors "Elite Level Software" --icon src/EliteLevel.Disc.App/Assets/icon.png --channel "$channel" --delta none --noPortable --releaseNotes release-notes.md --outputDir artifacts/velopack
          bash scripts/rename-release-assets.sh artifacts/velopack "$tag" linux "$channel"
          upload=(
            vpk upload github
            --outputDir artifacts/velopack
            --channel "$channel"
            --repoUrl https://github.com/EliteLevelSoftware/EliteLevelDiscfolio
            --token "$GITHUB_TOKEN"
            --publish
            --merge
            --releaseName "EliteLevel Discfolio $tag"
            --tag "$GITHUB_REF_NAME"
          )
          if [[ "$track" == prerelease ]]; then upload+=(--pre); fi
          "${upload[@]}"

  macos:
    name: macOS pack
    needs: windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 == "## " ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
      - name: Publish and pack
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dotnet publish src/EliteLevel.Disc.App/EliteLevel.Disc.App.csproj -c Release -r osx-arm64 --self-contained true -o artifacts/pack
          dotnet tool install --global vpk --version 1.2.161
          export PATH="$PATH:$HOME/.dotnet/tools"
          tag="${GITHUB_REF_NAME#v}"
          # macos-latest is bash 3.2. With set -u, "${pre[@]}" on an empty array
          # is an unbound variable, so a stable tag exited before vpk
          # (pre[@]: unbound variable). Keep each argument list non-empty and
          # append --pre only for a prerelease tag.
          if [[ "$tag" == *-* ]]; then track=prerelease; else track=stable; fi
          channel="osx-arm64-$track"
          mkdir -p artifacts/velopack
          # vpk builds the .app bundle and accepts only an .icns icon.
          vpk --yes pack \
            --packId Discfolio \
            --packVersion "$tag" \
            --packDir artifacts/pack \
            --mainExe Discfolio \
            --packTitle "EliteLevel Discfolio" \
            --packAuthors "Elite Level Software" \
            --icon src/EliteLevel.Disc.App/Assets/icon.icns \
            --channel "$channel" \
            --delta none \
            --noPortable \
            --releaseNotes release-notes.md \
            --outputDir artifacts/velopack
          bash scripts/rename-release-assets.sh artifacts/velopack "$tag" macos "$channel"
          ls -la artifacts/velopack
          upload=(
            vpk upload github
            --outputDir artifacts/velopack
            --channel "$channel"
            --repoUrl https://github.com/EliteLevelSoftware/EliteLevelDiscfolio
            --token "$GITHUB_TOKEN"
            --publish
            --merge
            --releaseName "EliteLevel Discfolio $tag"
            --tag "$GITHUB_REF_NAME"
          )
          if [[ "$track" == prerelease ]]; then upload+=(--pre); fi
          "${upload[@]}"

  checksums:
    name: SHA256SUMS
    needs: [windows, linux, macos]
    if: always() && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Write checksums for the uploaded assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo=EliteLevelSoftware/EliteLevelDiscfolio
          tag="${GITHUB_REF_NAME#v}"
          if [[ "$tag" == *-* ]]; then track=prerelease; else track=stable; fi
          release_json=$(mktemp)
          ready=0
          for _ in 1 2 3 4 5 6; do
            gh api "repos/${repo}/releases/tags/${GITHUB_REF_NAME}" > "$release_json"
            if jq -e '.assets | length > 0 and all(.[]; .digest != null and .digest != "")' "$release_json" >/dev/null; then
              ready=1
              break
            fi
            sleep 10
          done
          if [[ "$ready" -ne 1 ]]; then
            echo "a release asset is missing a digest" >&2
            exit 1
          fi
          jq -r '.assets[] | select(.name != "SHA256SUMS.txt") | "\(.digest | sub("^sha256:"; "") | ascii_downcase)  \(.name)"' "$release_json" \
            | LC_ALL=C sort -k2 > SHA256SUMS.txt
          if ! grep -E -q '^[0-9a-f]{64}  [^ ].+$' SHA256SUMS.txt; then
            echo "SHA256SUMS.txt is empty or malformed" >&2
            exit 1
          fi
          if grep -E -v '^[0-9a-f]{64}  [^ ].+$' SHA256SUMS.txt; then
            echo "SHA256SUMS.txt has a line that is not a digest" >&2
            exit 1
          fi
          if grep -E '(Portable\.zip|-delta\.nupkg)$' SHA256SUMS.txt; then
            echo "a portable zip or delta package was uploaded" >&2
            exit 1
          fi
          require_name() {
            if ! grep -F -q "  $1" SHA256SUMS.txt; then
              echo "SHA256SUMS.txt is missing $1" >&2
              exit 1
            fi
          }
          require_name "Discfolio-${tag}-Windows-Setup.exe"
          require_name "Discfolio-${tag}-win-x64-${track}-full.nupkg"
          require_name "releases.win-x64-${track}.json"
          if grep -F -q "linux-x64-${track}" SHA256SUMS.txt || grep -F -q "Linux-x64.AppImage" SHA256SUMS.txt; then
            require_name "Discfolio-${tag}-Linux-x64.AppImage"
            require_name "Discfolio-${tag}-linux-x64-${track}-full.nupkg"
            require_name "releases.linux-x64-${track}.json"
          fi
          if grep -F -q "osx-arm64-${track}" SHA256SUMS.txt || grep -F -q "macOS-AppleSilicon-Setup.pkg" SHA256SUMS.txt; then
            require_name "Discfolio-${tag}-macOS-AppleSilicon-Setup.pkg"
            require_name "Discfolio-${tag}-osx-arm64-${track}-full.nupkg"
            require_name "releases.osx-arm64-${track}.json"
          fi
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --repo "$repo" --clobber
